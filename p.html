<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operating System Spin Quiz</title>
<style>
/* ============ BASE ============ */
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:#222}
.scene{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.scene.on{display:flex;animation:fade .5s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.btn{border:0;cursor:pointer;font-weight:900;font-size:1.2rem;font-family:inherit;padding:14px 30px;border-radius:40px;color:#fff;background:#8a5cf6;box-shadow:0 6px 0 #5d38c4;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #5d38c4}

/* ============ 1. INTRO ============ */
#intro{background:linear-gradient(160deg,#7c3aed,#4c35b8 55%,#1e2a78);color:#fff;cursor:pointer;justify-content:space-between;padding:7vh 5vw 6vh}
#intro h1{font-size:clamp(32px,7.5vmin,68px);font-weight:900;line-height:1.15;text-shadow:0 5px 0 rgba(0,0,0,.18);animation:pop 1s .4s both}
#intro h1 em{font-style:normal;color:#ffd858;display:block}
#intro small{opacity:.8;font-size:1rem}
.stage{position:relative;width:min(80vw,420px);height:56vh}
.jumper{position:absolute;left:50%;bottom:58px;width:min(44vw,210px);margin-left:calc(min(44vw,210px)/-2);animation:jump 1.4s infinite}
@keyframes jump{0%{transform:translateY(0) rotate(-6deg);animation-timing-function:ease-out}
 50%{transform:translateY(-27vh) rotate(6deg);animation-timing-function:ease-in}
 100%{transform:translateY(0) rotate(-6deg)}}
.tramp{position:absolute;bottom:0;left:50%;width:min(62vw,300px);margin-left:calc(min(62vw,300px)/-2);transform-origin:bottom;animation:squash 1.4s infinite}
@keyframes squash{0%,100%{transform:scaleY(.78)}10%{transform:scaleY(1)}}
.armL,.armR{transform-box:view-box;animation:wave .35s ease-in-out infinite alternate}
.armL{transform-origin:52px 88px}
.armR{transform-origin:148px 88px;animation-direction:alternate-reverse}
@keyframes wave{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}

/* ============ 2. GIFT PARCEL ============ */
#gift{position:fixed;inset:0;z-index:10;display:none;overflow:hidden}
#gift.on{display:block}
.half{position:absolute;top:0;bottom:0;width:50%;transition:transform 1.1s cubic-bezier(.7,0,.3,1);
 background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 14px,rgba(0,0,0,.06) 14px 30px),radial-gradient(circle at 30% 20%,#ca42d9,#e439d3 75%)}
.half.l{left:0}.half.r{right:0}
.half::before{content:"";position:absolute;left:0;right:0;top:calc(50% - 5vmin);height:10vmin;background:linear-gradient(#a884df,#987bee 50%,#e2a900)}
.half::after{content:"";position:absolute;top:0;bottom:0;width:5vmin}
.half.l::after{right:0;background:linear-gradient(90deg,#e2a900,#ffe066)}
.half.r::after{left:0;background:linear-gradient(90deg,#ffe066,#e2a900)}
#gift.open .l{transform:translateX(-101%)}
#gift.open .r{transform:translateX(101%)}
#bow{position:absolute;left:50%;top:50%;width:38vmin;margin:-19vmin 0 0 -19vmin;z-index:2;animation:wiggle .5s infinite}
@keyframes wiggle{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.06)}}
#gift.open #bow{animation:bowgo .7s forwards}
@keyframes bowgo{to{transform:translateY(-45vh) scale(2.4) rotate(50deg);opacity:0}}

/* ============ 3. WHEEL SCENE ============ */
#wheelScene{background:linear-gradient(160deg,#e9d5ff,#c4a5f5 45%,#7c6bd6 80%,#3b3a8f);justify-content:flex-start;padding-top:3vh}
#wheelScene h2{font-size:clamp(28px,6vmin,54px);font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 4px 0 #5b21b6,0 8px 14px rgba(30,20,100,.45);margin-top:2vh}
#msg{min-height:1.4em;color:#2a1a6e;font-weight:700;margin:6px 12px}
#score{position:absolute;top:14px;right:14px;background:#fff;color:#5b21b6;font-weight:900;padding:8px 16px;border-radius:30px;box-shadow:0 4px 0 #8b6fd8}
.discWrap{--w:min(84vw,54vh,500px);position:relative;width:var(--w);height:var(--w);margin-top:14px;opacity:0;transform:scale(.3);transition:transform .9s cubic-bezier(.2,1.5,.4,1),opacity .4s}
.discWrap.pop{opacity:1;transform:scale(1)}
.disc{width:100%;height:100%;transition:transform 5s cubic-bezier(.12,.62,.08,1);filter:drop-shadow(0 10px 14px rgba(30,20,110,.45))}
.pointer{position:absolute;top:-16px;left:50%;margin-left:-16px;z-index:3;border-left:16px solid transparent;border-right:16px solid transparent;border-top:32px solid #1e2a78;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
#go{position:absolute;left:50%;top:50%;width:24%;height:24%;margin:-12% 0 0 -12%;border-radius:50%;border:7px solid #c4a5f5;cursor:pointer;
 font-weight:900;font-size:clamp(14px,3.6vmin,28px);font-family:inherit;color:#fff;background:radial-gradient(circle at 35% 30%,#a78bfa,#2a1f7a);box-shadow:0 5px 12px rgba(20,15,90,.6);animation:pulse 1.4s infinite}
#go:disabled{animation:none;filter:grayscale(.5);cursor:wait}
@keyframes pulse{50%{transform:scale(1.09)}}
.deco{display:flex;gap:min(5vw,30px);align-items:flex-end;margin-top:auto;padding-bottom:2vh}
.deco svg{width:min(17vw,84px);height:auto;filter:drop-shadow(0 4px 3px rgba(30,20,110,.35));animation:bob 2.4s ease-in-out infinite}
.deco svg:nth-child(2){animation-delay:.4s}.deco svg:nth-child(3){animation-delay:.8s}.deco svg:nth-child(4){animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-8px)}}

/* ============ QUESTION CARD ============ */
#quiz{background:linear-gradient(160deg,#7c3aed,#4c35b8 55%,#1e2a78);padding:16px}
.qcard{background:#fff;border-radius:28px;padding:clamp(18px,4vmin,34px);width:min(94vw,660px);box-shadow:0 14px 0 rgba(0,0,0,.15);animation:pop .5s both;text-align:left}
.qtag{display:inline-block;background:#e9d5ff;color:#4c1d95;font-weight:900;padding:5px 14px;border-radius:20px;margin-bottom:12px}
.qtext{font-size:clamp(1.15rem,3.2vmin,1.6rem);font-weight:900;color:#2b2350;margin-bottom:18px}
.opts{display:grid;gap:10px}
.opt{font-weight:800;font-size:clamp(.95rem,2.6vmin,1.15rem);font-family:inherit;text-align:left;padding:13px 16px;border-radius:16px;border:3px solid #e4dcff;background:#faf7ff;color:#2b2350;cursor:pointer;transition:transform .12s,border-color .12s}
.opt:hover:not(:disabled){transform:translateX(6px);border-color:#8a5cf6}
.opt b{display:inline-block;width:1.9em;height:1.9em;line-height:1.9em;text-align:center;border-radius:50%;background:#8a5cf6;color:#fff;margin-right:10px}
.opt.ok{background:#bff0cf;border-color:#2e9e5b}
.opt.bad{background:#ffc9d1;border-color:#e0354f;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ============ 4. CORRECT ============ */
#win{background:linear-gradient(#d8c4ff,#e173e9 55%,#2a2a85);gap:20px}
.giftwrap{position:relative;width:min(70vw,270px);height:180px;margin-top:min(36vh,250px)}
.gbase{position:absolute;bottom:0;left:0;width:100%;height:112px;background:#fff;border-radius:14px;z-index:3;box-shadow:0 12px 22px rgba(30,90,170,.3)}
.gbase::after,.glid::after{content:"";position:absolute;left:50%;margin-left:-15px;width:30px;top:0;bottom:0;background:#2f80ed}
.glid{position:absolute;bottom:104px;left:-10px;width:calc(100% + 20px);height:46px;background:#fff;border-radius:12px;z-index:4;box-shadow:0 6px 10px rgba(30,90,170,.25)}
.gcard{position:absolute;bottom:72px;left:-8%;width:116%;z-index:2;background:#fff;border:4px solid #2f80ed;border-radius:18px;padding:16px 14px 52px;opacity:0;transform:scale(.3);transform-origin:bottom}
.gcard .big{font-size:1.6rem;font-weight:900;color:#2e9e5b}
.gcard .ans{font-weight:900;color:#1d3f8a;margin:6px 0;font-size:1.1rem}
.gcard p{color:#aa5a97;font-size:.92rem}
.giftwrap.go .glid{animation:lidoff .9s .7s cubic-bezier(.5,-.4,.6,1) forwards}
.giftwrap.go .gcard{animation:cardup .9s 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
.giftwrap.go{animation:hop .5s .5s}
@keyframes lidoff{to{transform:translate(90%,-180%) rotate(28deg);opacity:0}}
@keyframes cardup{to{opacity:1;transform:scale(1) translateY(-20px)}}
@keyframes hop{50%{transform:translateY(-14px)}}
#winBtn{opacity:0;animation:fade .5s 2.4s forwards}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti span{position:absolute;top:-20px;width:10px;height:15px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ============ 5. WRONG ============ */
#lose{background:linear-gradient(160deg,#c655e0,#f572e2);color:#fff;gap:14px}
.sad{display:flex;align-items:center;gap:2vmin;font-size:min(30vmin,190px);animation:shake .6s 2}
.sad .th{font-size:.45em}
#lose h2{font-size:clamp(28px,7vmin,56px);font-weight:900}
#lose p{opacity:.85}
#lose .btn{background:#c4a5f5;color:#1e1b5e;box-shadow:0 6px 0 #7c5ccf}
</style>
</head>
<body>

<!-- 1. INTRO -->
<section id="intro" class="scene on">
  <h1>Welcome!<em>Let's explore Operating Systems Together</em></h1>
  <div class="stage">
    <svg class="jumper" viewBox="0 0 200 200" fill="none">
      <g stroke="#ffd858" stroke-width="13" stroke-linecap="round">
        <path class="armL" d="M52 88 L14 58"/><path class="armR" d="M148 88 L186 58"/><path d="M78 150 L46 182"/><path d="M122 150 L158 176"/>
      </g>
      <circle cx="100" cy="98" r="62" fill="#ffd858"/>
      <circle cx="78" cy="88" r="8" fill="#3d3d3d"/><circle cx="122" cy="88" r="8" fill="#3d3d3d"/>
      <path d="M86 110 Q100 132 114 110Z" fill="#a8322e"/><path d="M92 118 Q100 128 108 118Z" fill="#ff7a6b"/>
    </svg>
    <svg class="tramp" viewBox="0 0 300 130">
      <ellipse cx="150" cy="112" rx="120" ry="14" fill="#4a6de0"/>
      <rect x="80" y="62" width="9" height="52" rx="4" fill="#6bbcf0"/><rect x="210" y="62" width="9" height="52" rx="4" fill="#6bbcf0"/>
      <rect x="112" y="66" width="7" height="34" rx="3" fill="#6bbcf0"/><rect x="180" y="66" width="7" height="34" rx="3" fill="#6bbcf0"/>
      <ellipse cx="150" cy="52" rx="140" ry="26" fill="#6bbcf0"/><ellipse cx="150" cy="50" rx="112" ry="15" fill="#fff"/>
    </svg>
  </div>
  <small>Tap anywhere to start</small>
</section>

<!-- 2. GIFT PARCEL overlay -->
<div id="gift">
  <div class="half l"></div><div class="half r"></div>
  <svg id="bow" viewBox="-100 -100 200 200">
    <defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".5" stop-color="#f2b705"/><stop offset="1" stop-color="#b57d00"/></linearGradient></defs>
    <g fill="url(#gold)" stroke="#8a5a00" stroke-width="2">
      <path d="M0 0 L-70 70 L-40 80Z"/><path d="M0 0 L70 70 L40 80Z"/>
      <ellipse cx="0" cy="-48" rx="24" ry="48"/><ellipse cx="0" cy="-48" rx="24" ry="48" transform="rotate(60)"/>
      <ellipse cx="0" cy="-48" rx="24" ry="48" transform="rotate(120)"/><ellipse cx="0" cy="-48" rx="24" ry="48" transform="rotate(180)"/>
      <ellipse cx="0" cy="-48" rx="24" ry="48" transform="rotate(240)"/><ellipse cx="0" cy="-48" rx="24" ry="48" transform="rotate(300)"/>
      <circle r="20"/>
    </g>
  </svg>
</div>

<!-- 3. WHEEL -->
<section id="wheelScene" class="scene">
  <div id="score"></div>
  <h2>SPIN TO WIN</h2>
  <div id="msg">Press SPIN and land on a question!</div>
  <div class="discWrap" id="discWrap">
    <div class="pointer"></div>
    <div class="disc" id="disc">
      <svg viewBox="-100 -100 200 200">
        <circle r="99" fill="#1e2a78"/><circle r="93" fill="#ede4ff"/>
        <g id="slices"></g><g id="bulbs"></g>
      </svg>
    </div>
    <button id="go">SPIN</button>
  </div>
  <div class="deco">
    <svg viewBox="0 0 64 64"><rect x="5" y="7" width="54" height="36" rx="5" fill="#9be4c8"/><g fill="#fff"><rect x="17" y="15" width="13" height="9" rx="1"/><rect x="33" y="15" width="13" height="9" rx="1"/><rect x="17" y="26" width="13" height="9" rx="1"/><rect x="33" y="26" width="13" height="9" rx="1"/></g><rect x="27" y="43" width="10" height="8" fill="#6cc4a4"/><rect x="18" y="50" width="28" height="6" rx="3" fill="#6cc4a4"/></svg>
    <svg viewBox="0 0 64 64"><rect x="4" y="8" width="56" height="46" rx="7" fill="#ffe680"/><rect x="4" y="8" width="56" height="10" rx="5" fill="#f5cf4a"/><path d="M14 27 L26 35 L14 43" stroke="#7a54e8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 45 H48" stroke="#7a54e8" stroke-width="5" stroke-linecap="round"/></svg>
    <svg viewBox="0 0 64 64"><g stroke="#a67ff0" stroke-width="4" stroke-linecap="round"><path d="M22 6V16M32 6V16M42 6V16M22 48V58M32 48V58M42 48V58M6 22H16M6 32H16M6 42H16M48 22H58M48 32H58M48 42H58"/></g><rect x="14" y="14" width="36" height="36" rx="6" fill="#c9a9ff"/><rect x="23" y="23" width="18" height="18" rx="3" fill="#fff"/></svg>
    <svg viewBox="0 0 64 64"><path d="M6 20a8 8 0 0 1 8-8h14l6 8h16a8 8 0 0 1 8 8v22a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8z" fill="#8fd3f5"/><path d="M6 28h52v22a8 8 0 0 1-8 8H14a8 8 0 0 1-8-8z" fill="#b8e6fb"/></svg>
  </div>
</section>

<!-- QUESTION -->
<section id="quiz" class="scene">
  <div class="qcard">
    <span class="qtag" id="qtag"></span>
    <div class="qtext" id="qtext"></div>
    <div class="opts" id="opts"></div>
  </div>
</section>

<!-- 4. CORRECT -->
<section id="win" class="scene">
  <div class="confetti" id="confetti"></div>
  <div class="giftwrap" id="giftwrap">
    <div class="gcard"><div class="big">🎉 Correct!</div><div class="ans" id="winAns"></div><p id="winExp"></p></div>
    <div class="glid"></div><div class="gbase"></div>
  </div>
  <button class="btn" id="winBtn">Back to the wheel</button>
</section>

<!-- 5. WRONG -->
<section id="lose" class="scene">
  <div class="sad"><span class="th">👎</span><span>😒</span><span class="th">👎</span></div>
  <h2>Oops! Try again</h2>
  <p>That wasn't the right answer.</p>
  <button class="btn" id="loseBtn">↩️ Back to the wheel</button>
</section>

<script>
/* =====================================================
   YOUR QUESTIONS - edit here.
   Each one needs:  q  |  options  |  answer (0 = first option)  |  explain
   Slot 1 = Q1 ... slot 10 = Q10. Use null for an empty slot.
   ===================================================== */
const QUESTIONS = [
  { q: "What is it called when a program fails to release RAM after it closes?",
    options: ["A memory leak", "A time slice", "A GUI crash", "Batch automation"],
    answer: 0,
    explain: "Unreleased memory piles up over time as a memory leak, which can eventually crash the whole system." },

  { q: "Which Command Prompt command creates a new folder?",
    options: ["dir", "cls", "mkdir", "rmdir"],
    answer: 2,
    explain: "'mkdir foldername' builds a new directory - think 'make directory'." },

  { q: "Which interface typically needs more RAM and CPU power to run?",
    options: ["CLI", "GUI", "Both need zero resources", "Neither uses RAM"],
    answer: 1,
    explain: "The GUI's visuals, icons and windows are resource-heavy compared to the lightweight text-only CLI." },

  { q: "What is a 'time slice' in CPU scheduling?",
    options: ["A snack break for the processor", "A tiny, fixed portion of time given to each process", "A type of RAM chip", "A CLI command"],
    answer: 1,
    explain: "The OS scheduler gives each active process a fraction-of-a-millisecond time slice before switching to the next." },

  { q: "Multitasking on a single CPU is best described as...",
    options: ["Multiple CPUs working at once", "An illusion created by switching between tasks at high speed", "A memory leak", "A GUI-only feature"],
    answer: 1,
    explain: "A single CPU can only run one task at a time - rapid switching just makes it look simultaneous." },

  { q: "Which Command Prompt command lists the files and folders in the current directory?",
    options: ["dir", "cls", "mkdir", "exit"],
    answer: 0,
    explain: "'dir' shows the contents of the folder you are in." },

  { q: "Which built-in tool gives a live view of CPU % and memory used by each program?",
    options: ["File Explorer", "Command Prompt", "Task Manager", "Control Panel"],
    answer: 2,
    explain: "Task Manager is the OS's live dashboard for how resources are being divided among programs." },

  { q: "What does GUI stand for?",
    options: ["Graphical User Interface", "General User Input", "Graphic Universal Icon", "Guided User Instructions"],
    answer: 0,
    explain: "A GUI lets you use windows, icons and a mouse instead of typing commands." },

  { q: "According to your slides, the mouse was invented specifically for...",
    options: ["Playing games", "The GUI", "Typing faster", "The Command Prompt"],
    answer: 1,
    explain: "The mouse was invented for the GUI, giving users a way to point and click instead of typing commands." },

  { q: "Typing commands like 'mkdir' and 'dir' is an example of using which interface?",
    options: ["CLI", "GUI", "Touchscreen", "Voice assistant"],
    answer: 0,
    explain: "CLI means Command Line Interface - you control the computer by typing text commands." }
];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const done = new Set();
let score = 0, current = -1, rot = 0, busy = false, introTimer;
const total = () => QUESTIONS.filter(Boolean).length;
function show(id){ document.querySelectorAll('.scene').forEach(s => s.classList.toggle('on', s.id === id)); }

/* ---------- sounds (made with the browser, no files needed) ---------- */
let ac;
function tone(f, d, type='sine', v=.2, at=0, f2){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
    const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  }catch(e){}
}
const sfx = {
  tick: () => tone(900, .04, 'square', .05),
  pop:  () => tone(300, .14, 'sine', .35, 0, 1000),
  ding: () => { tone(880, .2, 'triangle', .25); tone(1320, .3, 'triangle', .2, .08); },
  win:  () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .3, 'triangle', .25, i * .1)),
  lose: () => { tone(320, .3, 'sawtooth', .13); tone(200, .55, 'sawtooth', .13, .25); }
};

/* ---------- 1 -> 2 -> 3 : intro, parcel, wheel ---------- */
introTimer = setTimeout(startGift, 7500);   // intro length in milliseconds

/* Backup: if the browser did not start the CSS jump, start it with JavaScript */
setTimeout(() => {
  const j = document.querySelector('.jumper'), t = document.querySelector('.tramp');
  if(j && j.animate && !j.getAnimations().length){
    j.animate([{transform:'translateY(0)'},{transform:'translateY(-27vh)'},{transform:'translateY(0)'}],
              {duration:1400, iterations:Infinity, easing:'ease-in-out'});
    t.animate([{transform:'scaleY(.78)'},{transform:'scaleY(1)',offset:.1},{transform:'scaleY(.78)'}],
              {duration:1400, iterations:Infinity});
  }
}, 300);
$('intro').addEventListener('click', startGift);

function startGift(){
  if(startGift.done) return; startGift.done = true;
  clearTimeout(introTimer); tone(1,.01,'sine',.001);   // unlock audio
  show('wheelScene');
  $('gift').className = 'on';
  setTimeout(() => { sfx.pop(); $('gift').classList.add('open'); $('discWrap').classList.add('pop'); }, 1900);
  setTimeout(() => { $('gift').className = ''; }, 3200);
}

/* ---------- wheel drawing ---------- */
const N = QUESTIONS.length, STEP = 360 / N;
const COLORS = ['#7c3aed','#1e2a78','#a855f7','#5b21b6','#c084fc','#16215e','#9333ea','#6d28d9','#3b2a9a','#b36bf5'];
const pt = (r, deg) => {
  const a = (deg - 90) * Math.PI / 180;           // 0 deg = top
  return [(r * Math.cos(a)).toFixed(2), (r * Math.sin(a)).toFixed(2)];
};

(function buildWheel(){
  let s = '';
  for(let i = 0; i < N; i++){
    const a0 = i * STEP - STEP / 2, a1 = i * STEP + STEP / 2;
    const [x0, y0] = pt(90, a0), [x1, y1] = pt(90, a1), [tx, ty] = pt(62, i * STEP);
    s += `<g id="sl${i}">` +
         `<path d="M0 0 L${x0} ${y0} A90 90 0 0 1 ${x1} ${y1}Z" fill="${COLORS[i % COLORS.length]}" stroke="#fff" stroke-width="1.5"/>` +
         `<text x="${tx}" y="${ty}" transform="rotate(${i * STEP} ${tx} ${ty})" text-anchor="middle" dominant-baseline="central" ` +
         `font-size="20" font-weight="900" fill="#fff" stroke="rgba(0,0,0,.25)" stroke-width=".6" style="paint-order:stroke">${i + 1}</text></g>`;
  }
  $('slices').innerHTML = s;

  let h = '';
  const bulbCount = N * 2;
  for(let i = 0; i < bulbCount; i++){
    const [bx, by] = pt(96, i * 360 / bulbCount + STEP / 2 * 0);
    h += `<circle cx="${bx}" cy="${by}" r="2.3" fill="${i % 2 ? '#c4a5f5' : '#fff'}"/>`;
  }
  $('bulbs').innerHTML = h;
})();

function updateScore(){ $('score').textContent = `⭐ ${score} / ${total()}`; }
function refreshWheel(){
  for(let i = 0; i < N; i++){
    const g = $('sl' + i);
    const gone = !QUESTIONS[i] || done.has(i);
    g.style.opacity = gone ? .3 : 1;
  }
  updateScore();
}
refreshWheel();

/* ---------- spin ---------- */
$('go').addEventListener('click', () => {
  if(busy) return;
  const left = [];
  for(let i = 0; i < N; i++) if(QUESTIONS[i] && !done.has(i)) left.push(i);

  if(!left.length){                    // everything answered: restart
    done.clear(); score = 0; refreshWheel();
    $('go').textContent = 'SPIN';
    $('msg').textContent = 'Press SPIN and land on a question!';
    return;
  }

  busy = true; $('go').disabled = true;
  $('msg').textContent = 'Spinning...';
  current = left[Math.floor(Math.random() * left.length)];

  // slice i's centre sits at i*STEP degrees clockwise from the top;
  // rotating the wheel so that (i*STEP + rot) % 360 == 0 puts it under the pointer
  const jitter = (Math.random() - .5) * (STEP * .6);
  rot = rot - (rot % 360) + 360 * 6 + (360 - current * STEP) + jitter;
  $('disc').style.transform = `rotate(${rot}deg)`;

  // ticking sound while spinning
  let n = 0;
  const tk = setInterval(() => { sfx.tick(); if(++n > 40) clearInterval(tk); }, 110);

  setTimeout(() => {
    clearInterval(tk); sfx.ding();
    $('msg').textContent = `Question ${current + 1}!`;
    setTimeout(showQuestion, 900);
  }, 5200);
});

/* ---------- question ---------- */
function showQuestion(){
  const Q = QUESTIONS[current];
  $('qtag').textContent = `Question ${current + 1}`;
  $('qtext').textContent = Q.q;
  const box = $('opts'); box.innerHTML = '';
  Q.options.forEach((txt, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<b>${'ABCD'[i]}</b>`;
    b.appendChild(document.createTextNode(txt));
    b.addEventListener('click', () => answer(i, b));
    box.appendChild(b);
  });
  show('quiz');
}

function answer(i, btn){
  const Q = QUESTIONS[current];
  const all = document.querySelectorAll('.opt');
  all.forEach(o => o.disabled = true);

  if(i === Q.answer){
    btn.classList.add('ok');
    setTimeout(() => celebrate(Q), 700);
  }else{
    btn.classList.add('bad');
    all[Q.answer].classList.add('ok');
    sfx.lose();
    setTimeout(() => show('lose'), 1100);
  }
}

/* ---------- correct ---------- */
function celebrate(Q){
  done.add(current); score++;
  $('winAns').textContent = Q.options[Q.answer];
  $('winExp').textContent = Q.explain;
  const gw = $('giftwrap');
  gw.classList.remove('go');
  show('win');
  void gw.offsetWidth;                // restart the animations
  gw.classList.add('go');
  sfx.win();

  const c = $('confetti'); c.innerHTML = '';
  const cols = ['#a855f7','#c084fc','#7c3aed','#e9d5ff','#3b4cc0','#1e2a78'];
  for(let k = 0; k < 60; k++){
    const sp = document.createElement('span');
    sp.style.left = Math.random() * 100 + '%';
    sp.style.background = cols[k % cols.length];
    sp.style.animationDuration = (2 + Math.random() * 2.5) + 's';
    sp.style.animationDelay = (Math.random() * 1.2) + 's';
    c.appendChild(sp);
  }
}

/* ---------- back to the wheel ---------- */
function backToWheel(){
  busy = false; $('go').disabled = false;
  refreshWheel();
  if(done.size >= total()){
    $('msg').textContent = `🏆 All done! You scored ${score} out of ${total()}. Press AGAIN to replay.`;
    $('go').textContent = 'AGAIN';
  }else{
    $('msg').textContent = 'Press SPIN and land on a question!';
  }
  show('wheelScene');
}
$('winBtn').addEventListener('click', backToWheel);
$('loseBtn').addEventListener('click', backToWheel);
</script>
</body>
